# Temporal: comprueba Jamendo y el Archive contra la red de verdad. Se borra al terminar.
name: Prueba real de fuentes
on:
  push:
    branches: [prueba-jamendo-temporal]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -q -e ".[dev]"
      - name: Buscar y bajar de verdad
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          clave = os.environ["JAMENDO_CLIENT_ID"]
          def ver(url):
              try:
                  r = urlopen(Request(url, headers={"User-Agent": "Mozilla/5.0"}))
                  print("   ->", r.status, r.geturl()[:110], r.headers.get("Content-Type"), r.headers.get("Content-Length"), r.read(8))
              except HTTPError as e:
                  print("   -> HTTP", e.code, url[:110])
          for extra in ({"audiodlformat": "flac"}, {"audioformat": "flac"}, {"audiodlformat": "flac", "audioformat": "flac"}):
              d = json.load(urlopen("https://api.jamendo.com/v3.0/tracks/?" + urlencode({
                  "client_id": clave, "format": "json", "search": "lofi", "limit": 2, **extra})))
              print(extra, "status", d["headers"].get("status"), d["headers"].get("error_message"), "n", len(d["results"]))
              for t in d["results"]:
                  print("  ", t["id"], t["audiodownload_allowed"], "DL:", t["audiodownload"], "AUDIO:", t["audio"][:90])
                  if t["audiodownload"]: ver(t["audiodownload"])
                  ver(t["audio"])
          for fmt in ("flac", "mp32", "ogg"):
              ver(f"https://prod-1.storage.jamendo.com/download/track/2277995/{fmt}/")
          PY
