# Temporal: comprueba Jamendo y el Archive contra la red de verdad. Se borra al terminar.
name: Prueba real de fuentes
on:
  push:
    branches: [prueba-jamendo-temporal]
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -q -e ".[dev]"
      - name: Buscar y bajar de verdad
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          clave = os.environ["JAMENDO_CLIENT_ID"]
          for fmt in ("flac", "mp32"):
              d = json.load(urlopen(f"https://api.jamendo.com/v3.0/tracks/?" + urlencode({
                  "client_id": clave, "format": "json", "search": "lofi", "limit": 3,
                  "audiodlformat": fmt, "audioformat": "mp32"})))
              for t in d["results"]:
                  print(fmt, t["id"], t["audiodownload_allowed"], "DL:", t["audiodownload"], "AUDIO:", t["audio"])
                  if t["audiodownload"]:
                      r = urlopen(Request(t["audiodownload"], headers={"User-Agent": "Mozilla/5.0"}))
                      cab = r.read(16)
                      print("   ->", r.status, r.geturl()[:120], r.headers.get("Content-Type"), r.headers.get("Content-Length"), cab[:8])
          PY
