# Prueba contra la red de verdad lo que las pruebas normales no pueden tocar.
#
# Las pruebas del repositorio no salen a internet (es una regla del
# proyecto). Esta si: corre .github/prueba_red.py cuando cambia, o a mano,
# para comprobar que una fuente nueva responde como se espera antes de
# darla por buena.
name: Prueba de red

on:
  push:
    branches: ["claude/**"]
    paths: [".github/prueba_red.py"]
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -q -e ".[dev]"
      - name: Fuentes de verdad
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: python .github/prueba_red.py
