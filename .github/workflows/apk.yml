# Compila la app movil y pasa las pruebas en los servidores de GitHub.
#
# En el PC de desarrollo, Smart App Control de Windows bloquea las
# herramientas de Flutter porque no llevan firma digital. Aqui corren en una
# maquina de GitHub y el PC solo descarga el APK ya hecho.
name: APK

on:
  push:
    branches: [movil]
    paths: ["movil/**", "descargador/**", "tests/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

# Publicar el APK de prueba como version del repositorio.
permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Chaquopy instala las librerias de Python con el Python del equipo, y
      # tiene que ser la misma version que lleva la app.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Pruebas del nucleo
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m mypy
          python -m unittest discover -s tests

      - name: Pruebas de la app
        working-directory: movil
        run: |
          flutter pub get
          flutter analyze
          # Cada prueba fallida sale como anotacion, legible sin iniciar sesion.
          flutter test --reporter github

      # La misma clave de depuracion que el PC: con otra, Android no deja
      # instalar el APK encima de la app que ya hay en el telefono, y habria que
      # desinstalarla perdiendo listas, catalogo y ajustes.
      - name: Clave de firma
        env:
          CLAVE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$CLAVE" ]; then
            echo "$CLAVE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::Sin el secreto DEBUG_KEYSTORE: el APK no se podra instalar encima del actual."
          fi

      - name: Compilar
        working-directory: movil
        run: flutter build apk --release

      # Una sola version «apk-prueba», que se sustituye en cada compilacion.
      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-prueba --yes --cleanup-tag || true
          gh release create apk-prueba movil/build/app/outputs/flutter-apk/app-release.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "APK de prueba" \
            --notes "Compilado de ${GITHUB_SHA::7}. Solo para probar en el telefono de desarrollo."
