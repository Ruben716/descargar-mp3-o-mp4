# Compila la app movil y pasa las pruebas en los servidores de GitHub.
# El APK queda en la version «apk-prueba» del repositorio.
#
# En el PC de desarrollo, Smart App Control de Windows bloquea las
# herramientas de Flutter porque no llevan firma digital. Aqui corren en una
# maquina de GitHub y el PC solo descarga el APK ya hecho.
name: APK

on:
  push:
    # ademas de movil, la rama de trabajo del anime en espanol
    branches: [movil, anime-fuentes]
    paths: ["movil/**", "descargador/**", "tests/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

# Publicar el APK de prueba como version del repositorio.
permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Chaquopy instala las librerias de Python con el Python del equipo, y
      # tiene que ser la misma version que lleva la app.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Pruebas del nucleo
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m mypy
          python -m unittest discover -s tests

      # Cada prueba fallida sale como anotacion, con su nombre y su error: las
      # anotaciones se leen sin iniciar sesion, los registros no.
      - name: Dependencias de la app
        working-directory: movil
        run: flutter pub get

      - name: Analisis de la app
        working-directory: movil
        run: flutter analyze

      # Cada prueba fallida sale como anotacion, con su nombre y su error: las
      # anotaciones se leen sin iniciar sesion, los registros no.
      - name: Pruebas de la app
        working-directory: movil
        run: flutter test --reporter json > resultados.json 2>&1

      - name: Anotar las pruebas fallidas
        if: always()
        working-directory: movil
        run: python ../.github/anotar_pruebas.py resultados.json

      # La misma clave de depuracion que el PC: con otra, Android no deja
      # instalar el APK encima de la app que ya hay en el telefono, y habria que
      # desinstalarla perdiendo listas, catalogo y ajustes.
      - name: Clave de firma
        env:
          CLAVE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$CLAVE" ]; then
            # Sin saltos de linea ni espacios: el Bloc de notas puede colarlos.
            echo "$CLAVE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/firma.keystore"
            echo "CLAVE_FIRMA=$RUNNER_TEMP/firma.keystore" >> "$GITHUB_ENV"
            # La huella, para comprobar que es la del PC sin ensenar la clave.
            keytool -J-Duser.language=en -list -v -keystore "$RUNNER_TEMP/firma.keystore" \
              -storepass android | grep -m1 SHA256 | sed 's/^/::notice title=Firma::/'
          else
            echo "::warning::Sin el secreto DEBUG_KEYSTORE: el APK no se podra instalar encima del actual."
          fi

      - name: Compilar
        working-directory: movil
        run: flutter build apk --release

      # Una sola version «apk-prueba», que se sustituye en cada compilacion.
      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-prueba --yes --cleanup-tag || true
          gh release create apk-prueba movil/build/app/outputs/flutter-apk/app-release.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "APK de prueba" \
            --notes "Compilado de ${GITHUB_SHA::7}. Solo para probar en el telefono de desarrollo."
